[project]
name = "centralino"
version = "0.1.0"
description = "Centralino del bus di Agent Team OS: unico scrittore dello stato (SQLite), API su socket locale. BR24-F3."
requires-python = ">=3.12,<3.15"
dependencies = []

[project.scripts]
centralino = "centralino.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/centralino"]

[tool.pytest.ini_options]
testpaths = ["tests"]
